upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M;

    location /static/ {
        alias /staticfiles/;
        expires 30d;
        try_files $uri @bundles_fallback;
    }

    location @bundles_fallback {
        rewrite ^/static/(.*)$ /bundles/$1 break;
        proxy_pass http://frontend;
    }

    location /media/ {
        alias /media/;
        expires 30d;
    }

    location /bundles/ {
        proxy_pass http://frontend;
    }

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
